name: Bygg Android-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installera paket
        run: npm install

      - name: Skapa Android-projektet
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "Ikoner hoppades över"
          npx cap sync android

      - name: Bygg APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Döp om filen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fokusveckan.apk

      - name: Spara som byggfil
        uses: actions/upload-artifact@v4
        with:
          name: Fokusveckan-apk
          path: Fokusveckan.apk

      - name: Publicera under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fokusveckan testversion ${{ github.run_number }}
          body: |
            Testversion av Fokusveckan för Android.
            Ladda ner Fokusveckan.apk nedan på din Android-mobil och öppna filen för att installera.
          files: Fokusveckan.apk
